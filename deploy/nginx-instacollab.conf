# InstaCollab UZ — mavjud nginx uchun ALOHIDA sayt fayli.
#
# Bu fayl /etc/nginx/sites-available/instacollab.conf ga joylanadi va
# sites-enabled ga bog'lanadi. Serverdagi boshqa saytlarga umuman tegmaydi.
#
# HTTPS: sudo certbot --nginx -d {{DOMAIN}}
# (certbot bu faylni o'zi to'ldiradi va 443 blokini qo'shadi)

server {
    listen 80;
    listen [::]:80;
    server_name {{DOMAIN}};

    # Telegram Mini App katta bo'lmagan so'rovlar yuboradi.
    client_max_body_size 2m;

    # Statik fayllar va API — hammasi Node jarayoniga uzatiladi.
    location / {
        proxy_pass http://127.0.0.1:{{PORT}};
        proxy_http_version 1.1;

        # Ilova haqiqiy mijoz IP'sini va protokolni bilishi kerak:
        # rate-limit shunga qarab ishlaydi, cookie esa Secure bayrog'ini oladi.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
    }

    # Yig'ilgan fayllar nomida xesh bor — uzoq muddat keshlash xavfsiz.
    location /assets/ {
        proxy_pass http://127.0.0.1:{{PORT}};
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    access_log /var/log/nginx/instacollab.access.log;
    error_log  /var/log/nginx/instacollab.error.log;
}
